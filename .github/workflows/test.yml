name: Test Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker/test-db/docker-compose.yaml
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare .env
        if: hashFiles('.env.example') != ''
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Start stack and wait for healthy
        if: hashFiles('docker/test-db/docker-compose.yaml') != ''
        run: docker compose up -d --wait --wait-timeout 120

      - name: Show status
        if: hashFiles('docker/test-db/docker-compose.yaml') != ''
        run: docker compose ps

      - name: Run tests
        timeout-minutes: 10
        run: uv run pytest -ra

      - name: Show logs on failure
        if: failure() && hashFiles('docker/test-db/docker-compose.yaml') != ''
        run: docker compose logs

      - name: Tear down
        if: always() && hashFiles('docker/test-db/docker-compose.yaml') != ''
        run: docker compose down -v
